33px}.controls button{min-width:44px;padding:6px 12px}.done .name{text-decoration:line-through;color:var(--sub)}progress{width:100%;height:10px;accent-color:var(--green)}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}footer{font-size:12px;color:var(--sub);padding-bottom:max(24px,env(safe-area-inset-bottom))}#notice{position:sticky;bottom:12px;margin:0 auto;max-width:520px;padding:0 16px;z-index:10}#notice:not(:empty){padding:12px 16px;background:var(--green);color:var(--on);border-radius:12px}#storage-error{padding:12px;background:var(--paper);border:2px solid #b75c41}a{color:var(--green)}[hidden]{display:none!important}.place-row{display:flex;gap:8px;margin:8px 0}.place-row>button:first-child{flex:1;text-align:left;overflow-wrap:anywhere}
.home-intro h1{font-size:23px;margin:0 0 5px}.home-intro p{margin:0 0 16px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.section-heading h2{margin:0}.destination-card{border:1px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden}.destination-card .tile{width:100%;border:0;border-radius:0;padding:12px;min-height:96px}.destination-card .icon{display:inline;font-size:18px;margin-right:6px}.destination-card strong{font-size:15px;overflow-wrap:anywhere}.destination-card .sub{display:block;margin-top:3px;font-size:12px}.edit-default{border:0;border-top:1px solid var(--line);border-radius:0;width:100%;padding:5px 10px;min-height:38px;font-size:13px;color:var(--green);background:var(--soft)}.my-places{margin:22px 0 16px;padding:18px 14px;border-top:3px solid var(--green);border-radius:0 0 16px 16px;background:var(--soft)}.my-places>p{margin:0 0 10px}.empty-place{color:var(--sub);font-size:14px;padding:12px 0}.family-settings{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.weather-compact{border-top:1px solid var(--line);margin-top:14px;font-size:13px}.weather-compact summary{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.weather-compact summary span:first-child{flex:1}.weather-compact select{font-size:16px}.weather-manual{padding-bottom:12px}.share-intro{margin:16px 0}.save-actions{display:grid;gap:8px}dialog{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:20px;width:min(540px,calc(100% - 24px));max-height:90dvh;padding:18px}dialog::backdrop{background:#0009}dialog h2{margin:0}.image-page{margin-top:16px}.image-page img{display:block;width:100%;height:auto;border-radius:10px}.download-image{display:block;text-align:center;min-height:44px;padding:10px;margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px}button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:3px}

<header><strong class="wordmark">아이랑 나가요<span>.</span></strong><div id="header-tools"></div></header>
<div id="storage-error" role="alert" hidden></div><main id="app"></main><div id="notice" role="status" aria-live="polite"></div>
<footer>아이 정보와 준비물은 이 기기의 브라우저에 저장돼요.<br>사이트 데이터 삭제 시 사라지며 다른 기기와 자동 동기화되지 않아요. · v3.0</footer>

<script>
'use strict';
const KEY='aigo_family_v2';
const appStartedAt=Date.now();
const DEST=[{id:'short',name:'잠깐 외출',icon:'🥐',desc:'가까운 곳에 가볍게'},{id:'park',name:'공원·나들이',icon:'🌳',desc:'바깥에서 보내는 하루'},{id:'food',name:'식당·카페',icon:'🍽️',desc:'함께 먹는 즐거움'},{id:'indoor',name:'도서관·실내',icon:'📚',desc:'책과 놀이가 있는 곳'},{id:'family',name:'가족·친척 집',icon:'🏡',desc:'반가운 사람들 만나기'},{id:'trip',name:'여행·숙박',icon:'🧳',desc:'하룻밤 이상 머무르기'}];
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID();
const empty=()=>({version:2,children:[],active:null,places:[],drafts:{},weather:'normal',migrated:false});
let data=empty(),screen='home',editing=null,placeEditing=null,toastTimer;
function storageError(){const el=document.getElementById('storage-error');el.hidden=false;el.textContent='이 브라우저에 저장하지 못했어요. 브라우저의 저장 공간과 사이트 데이터 설정을 확인해주세요. 지금 변경한 내용은 앱을 닫으면 사라질 수 있어요.';}
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v.version!==2||!Array.isArray(v.children)||!Array.isArray(v.places)||!v.drafts)throw Error('invalid');data=v;}}catch(e){storageError();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){storageError();return false;}}
function toast(text){document.getElementById('notice').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('notice').textContent='',3500);}
function child(){return data.children.find(c=>c.id===data.active)||data.children[0];}
function draft(){return data.drafts[child()?.id];}
function age(birth){const d=new Date(birth+'T00:00:00'),n=new Date();return Math.max(0,(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0));}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function item(name,qty=1,kind='base',reason='기본 준비물'){return {id:id(),name,qty,kind,reason,checked:false};}
function rules(type,c){let a=[item('물티슈'),item('손수건')];if(c.diaper)a.push(item('기저귀',type==='trip'?8:type==='park'?4:2,'diaper','아이 생활 정보'),item('기저귀 처리 봉투',2,'diaper','아이 생활 정보'));if(c.feed)a.push(item('평소 수유용품',1,'feed','아이 생활 정보'));if(age(c.birth)>=6)a.push(item('평소 마시는 물 / 물병'));
if(type!=='short')a.push(item('여벌 옷',type==='trip'?3:1));
if(type==='park')a.push(item('돗자리'),item('모자'),item('지퍼백',2));
if(type==='food')a.push(item('턱받이 / 앞치마'),item('아이용 식기'));
if(type==='indoor')a.push(item('회원증 / 입장권'),item('반납할 책'));
if(type==='family')a.push(item('애착인형 / 장난감'));
if(type==='trip')a.push(item('잠옷'),item('세면도구'),item('충전기'),item('잠자리용 애착물건'));
return a;}
function weatherItems(w){if(w.includes('+'))return w.split('+').flatMap(weatherItems);return w==='rain'?[item('우산 / 우비',1,'weather','비 오는 날 추가'),item('작은 타월',1,'weather','비 오는 날 추가')]:w==='hot'?[item('모자',1,'weather','더운 날 추가')]:w==='cold'?[item('따뜻한 겉옷',1,'weather','추운 날 추가')]:[];}
function combine(base,w,c){const seen=new Set();return [...base.filter(i=>(i.kind!=='diaper'||c.diaper)&&(i.kind!=='feed'||c.feed)),...weatherItems(w)].filter(i=>{if(seen.has(i.name))return false;seen.add(i.name);return true;}).map(i=>({...i,id:id(),checked:false}));}
function normalizeItems(items){if(!Array.isArray(items))return [];return items.slice(0,150).filter(i=>i&&typeof i.name==='string').map(i=>item(i.name.slice(0,80),Math.max(1,Math.min(99,Number(i.qty)||1)),/기저귀/.test(i.name)?'diaper':'custom','이전 목록에서 가져옴'));}
function migrate(c){if(data.migrated)return;try{const old=JSON.parse(localStorage.getItem('aigo_templates_v1')||'{}');for(const [name,v]of Object.entries(old)){if(v&&Array.isArray(v.items))data.places.push({id:id(),childId:c.id,name:name.slice(0,40),type:'short',items:normalizeItems(v.items)});}const oldDraft=JSON.parse(localStorage.getItem('aigo_draft_v1')||'null');if(oldDraft?.items?.length)data.drafts[c.id]={title:'이전 준비물',type:'short',placeId:null,weather:'normal',items:normalizeItems(oldDraft.items).map((i,n)=>({...i,checked:!!oldDraft.items[n]?.checked}))};data.migrated=true;}catch(e){toast('이전 목록을 가져오지 못했어요. 기존 저장 데이터는 보존돼 있어요.');}}
function start(type,place){const c=child();const old=draft();if(old?.items.some(i=>i.checked)&&!confirm('새 외출을 시작하면 준비 중인 체크 상태가 바뀝니다. 새로 시작할까요?'))return;data.drafts[c.id]={title:place?.name||baseName(type),type,placeId:place?.id||null,createdAt:Date.now(),autoWeather:true,weather:data.weather,items:combine(place?place.items:baseItems(type,c),data.weather,c)};save();screen='list';render();window.scrollTo(0,0);}
function bind(name,fn){document.getElementById(name)?.addEventListener('click',fn);}
function weatherLabel(w){if(w.includes('+'))return w.split('+').map(weatherLabel).join(' · ');return {normal:'추가 없음',rain:'비',hot:'더움',cold:'추움'}[w]||'추가 없음';}
function render(){
const c=child();if(!c&&screen!=='profile'){screen='profile';editing=null;}
if(screen==='profile'){renderProfile();return;}
if(screen==='base'&&baseEdit){renderBaseEditor();return;}
if(screen==='place'){renderPlace();return;}
if(screen==='list'&&draft()){renderList();mountListExtras();return;}
screen='home';
renderHeaderTools(c); app.innerHTML=homeMarkup(c);bindHomeExtras();
bind('edit-child',()=>{editing=c.id;screen='profile';render();});bind('add-child',()=>{editing=null;screen='profile';render();});bind('add-place',()=>{placeEditing=null;screen='place';render();});bind('resume',()=>{screen='list';render();});
app.querySelectorAll('[data-dest]').forEach(b=>b.onclick=()=>start(b.dataset.dest));app.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const p=data.places.find(p=>p.id===b.dataset.place);start(p.type,p);});app.querySelectorAll('[data-edit-place]').forEach(b=>b.onclick=()=>{placeEditing=b.dataset.editPlace;screen='place';render();});
app.querySelectorAll('[data-edit-base]').forEach(b=>b.onclick=()=>editBase(b.dataset.editBase));
window.AigoWeather?.mount(applyAutomaticWeather);
}
function renderProfile(){const c=data.children.find(x=>x.id===editing),p=c||{name:'',birth:'',sex:'',diaper:true,feed:false};app.innerHTML=`${child()?'<button id="back">← 돌아가기</button>':''}<h1>${c?'우리 아이 정보':'우리 아이를 알려주세요'}</h1><p class="sub">처음 한 번 등록하면 다음 외출부터 기억할게요.</p><form id="profile-form"><label class="field">아이 이름<input name="name" required maxlength="20" value="${esc(p.name)}" placeholder="이름 또는 애칭"></label><label class="field">생년월일<input type="date" name="birth" required max="${localDate()}" value="${esc(p.birth)}"></label><label class="field">성별<select name="sex">${['','여아','남아'].map(x=>`<option value="${x}" ${x===p.sex?'selected':''}>${x||'선택 안 함'}</option>`).join('')}</select></label><div class="panel"><strong>지금 우리 아이는</strong><label class="line"><input type="checkbox" name="diaper" ${p.diaper?'checked':''}>기저귀를 사용해요</label><label class="line"><input type="checkbox" name="feed" ${p.feed?'checked':''}>외출할 때 수유용품을 챙겨요</label><p class="sub">기저귀를 졸업하면 여기서 꺼주세요. 개월 수는 자동으로 계산하고, 생활 습관은 직접 변경해요.</p></div><button class="primary wide">${c?'변경 내용 저장':'등록하고 시작하기'}</button></form>`;bind('back',()=>{screen='home';render();});document.getElementById('profile-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),birth=f.get('birth');if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(birth)||birth>localDate())return;const profile={id:c?.id||id(),name,birth,sex:f.get('sex'),diaper:f.has('diaper'),feed:f.has('feed')};if(c)data.children[data.children.indexOf(c)]=profile;else data.children.push(profile);data.active=profile.id;migrate(profile);const ok=save();screen='home';render();if(ok)toast('아이 정보를 저장했어요. 새로 시작하는 준비물에 반영됩니다.');restoreShare();};}
function renderPlace(){const p=data.places.find(p=>p.id===placeEditing);app.innerHTML=`<button id="back">← 돌아가기</button><h1>${p?'내 장소 수정':'자주 가는 곳 추가'}</h1><form id="place-form"><label class="field">장소 이름<input name="name" required maxlength="40" value="${esc(p?.name||'')}" placeholder="예: 동네빵집, 동네도서관"></label><label class="field">기본 목적지<select name="type" ${p?'disabled':''}>${DEST.map(d=>`<option value="${d.id}" ${d.id===p?.type?'selected':''}>${d.name}</option>`).join('')}</select></label><p class="sub">기본 추천으로 시작하고 준비물은 자유롭게 바꿀 수 있어요.</p><button class="primary wide">${p?'이름 저장':'만들고 준비물 보기'}</button></form>${p?'<button id="delete-place" class="wide" style="margin-top:12px">이 장소 삭제</button>':''}`;bind('back',()=>{screen='home';render();});document.getElementById('place-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name)return;if(p){p.name=name;save();screen='home';render();}else{const type=f.get('type'),newPlace={id:id(),childId:child().id,name,type,items:baseItems(type).map(i=>({...i,checked:false}))};data.places.push(newPlace);save();start(type,newPlace);}};bind('delete-place',()=>{if(confirm('이 장소의 저장한 준비물을 삭제할까요?')){data.places=data.places.filter(x=>x.id!==p.id);save();screen='home';render();}});}
function renderList(){const d=draft(),done=d.items.filter(i=>i.checked).length;app.innerHTML=`<button id="home">← 목적지 선택</button><h1>${esc(d.title)} 준비물</h1><div class="row"><span class="chip">${esc(child().name)} · ${age(child().birth)}개월</span><span class="chip">날씨 ${weatherLabel(d.weather)}</span></div><div class="share-intro"><button id="share-image" class="primary wide">준비물 이미지로 보내기</button><p class="sub">수량과 챙긴 상태가 담긴 이미지를 가족에게 보내세요.</p></div><div class="panel"><div class="row between"><strong>${done===d.items.length&&done?'준비 끝! 잘 다녀오세요 🌿':'하나씩 챙겨볼까요?'}</strong><span id="count" aria-live="polite">${done} / ${d.items.length}</span></div><progress value="${done}" max="${d.items.length||1}" aria-label="준비 완료"></progress>${d.items.map((i,n)=>`<div class="item ${i.checked?'done':''}"><label><input type="checkbox" data-check="${n}" ${i.checked?'checked':''}><span class="name">${esc(i.name)} <small>${esc(i.reason)}</small></span></label><div class="controls"><button data-minus="${n}" aria-label="${esc(i.name)} 수량 줄이기">−</button><span>${i.qty}개</span><button data-plus="${n}" aria-label="${esc(i.name)} 수량 늘리기">＋</button><button data-delete="${n}" aria-label="${esc(i.name)} 삭제">삭제</button></div></div>`).join('')}<form id="item-form" class="row" style="margin-top:16px"><input name="name" placeholder="준비물 직접 추가" aria-label="추가할 준비물" required maxlength="80" style="flex:1;width:130px"><button>추가</button></form></div><div class="save-actions">${!d.placeId?'<button id="save-default" class="wide">이 구성을 기본 목적지에 저장</button>':''}<button id="save-place" class="wide">${d.placeId&&data.places.some(p=>p.id===d.placeId)?'내 장소에 이 구성 저장':'별도 내 장소로 저장'}</button></div><p class="sub">체크 상태는 자동 저장돼요. 구성 저장은 항목과 수량만 기억하고, 날씨 항목은 다음 외출의 날씨에 맞춰 추가해요.</p><details><summary class="sub">링크로도 공유할 수 있어요</summary><button id="share" class="wide">준비물 링크 복사</button></details>`;
bind('share-image',()=>window.AigoImage.open({title:d.title,date:new Date().toLocaleDateString('ko-KR'),items:d.items.map(i=>({...i}))}));
bind('save-default',()=>{storeBase(d.type,d.title,d.items);if(save())toast('기본 목적지에 저장했어요.');});
bind('home',()=>{screen='home';render();});for(const action of ['check','minus','plus','delete'])app.querySelectorAll('[data-'+action+']').forEach(b=>{const fn=()=>{const i=Number(b.dataset[action]);if(action==='check')d.items[i].checked=b.checked;if(action==='minus')d.items[i].qty=Math.max(1,d.items[i].qty-1);if(action==='plus')d.items[i].qty=Math.min(99,d.items[i].qty+1);if(action==='delete')d.items.splice(i,1);save();render();};if(action==='check')b.onchange=fn;else b.onclick=fn;});
document.getElementById('item-form').onsubmit=e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name)return;if(d.items.some(i=>i.name===name)){toast('이미 있는 준비물이에요.');return;}if(d.items.length>=150){toast('준비물은 150개까지 추가할 수 있어요.');return;}d.items.push(item(name,1,'custom','내가 추가한 준비물'));save();render();};
bind('save-place',()=>{let p=data.places.find(p=>p.id===d.placeId);if(!p){const name=prompt('장소 이름을 적어주세요.',d.title)?.trim().slice(0,40);if(!name)return;p={id:id(),childId:child().id,name,type:d.type};data.places.push(p);d.placeId=p.id;d.title=name;}p.items=d.items.filter(i=>i.kind!=='weather').map(i=>({...i,checked:false}));if(save())toast('내 장소에 저장했어요. 다음 외출은 새 체크로 시작해요.');render();});
bind('share',async()=>{const payload={items:d.items.map(i=>({name:i.name,qty:i.qty}))};const url=location.origin+location.pathname+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));try{await navigator.clipboard.writeText(url);toast('준비물 공유 링크를 복사했어요.');}catch{prompt('아래 준비물 링크를 복사해주세요.',url);}});}
function restoreShare(){if(!child()||!location.hash.startsWith('#s='))return;try{if(location.hash.length>100000)throw Error('large');const v=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));const items=normalizeItems(v.items);if(!items.length)throw Error('empty');if(confirm('공유받은 준비물을 불러올까요? 현재 준비 중인 목록을 대신합니다.')){data.drafts[child().id]={title:'공유받은',type:'short',placeId:null,weather:'normal',items};save();screen='list';render();}history.replaceState(null,'',location.pathname+location.search);}catch{toast('공유 링크를 읽을 수 없어요.');}}
render();restoreShare();window.AigoWeather?.init(applyAutomaticWeather);
if('serviceWorker'in navigator){let refreshing=false;const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!refreshing){refreshing=true;location.reload();}});window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});});}
</script>
</body></html>
